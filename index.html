<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jie Shi Lee — Product Designer & Photographer</title>

  <!-- Favicon: logo concept 06 "Tilted Tile" from jsl-logo-concepts.html —
       the teal rounded tile with a white J, tipped -6°. -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

  <!-- Jost = free geometric sans in the spirit of Futura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap"
    rel="stylesheet">

  <style>
    /* =========================================================================
   THEME TOKENS
   ========================================================================= */
    :root {
      --bg: #eaf8f5;
      /* fresh seafoam canvas */
      --ink: #17181a;
      /* near-black — name, primary text */
      --muted: #069494;
      /* teal pop — the big role line */
      --sub: #526f6b;
      /* refined slate-teal mid grey */
      --line: #c8ece5;
      /* hairline dividers */
      --teal: #069494;
      /* primary signature teal */
      --teal-secondary: #e1f9f4;
      /* secondary vibrant seafoam */
      --teal-dark: #046868;
      /* deep teal for contrast */
      --teal-soft: #e1f9f4;
      /* soft seafoam tint */
      --teal-glow: rgba(6, 148, 148, 0.18);
      /* luminous glow */
      --accent: var(--teal);
      /* interactive accents */

      --maxw: 1400px;
      --gutter: clamp(1.25rem, 5vw, 5rem);

      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    ::selection {
      background: var(--teal);
      color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Jost', system-ui, sans-serif;
      background-color: #f4fdfb;
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      transition: color .7s var(--ease);
    }

    /* Page-specific desktop cursors. Touch devices keep their native behavior. */
    @media (hover: hover) and (pointer: fine) {

      body[data-cursor-view="home"],
      body[data-cursor-view="home"] *,
      body[data-cursor-view="work"],
      body[data-cursor-view="work"] *,
      body[data-cursor-view="detail"],
      body[data-cursor-view="detail"] * {
        cursor: url("images/cursor-arrow.svg") 4 4, default !important;
      }

      body[data-cursor-view="about"],
      body[data-cursor-view="about"] * {
        cursor: url("images/tennis-ball-cursor.png") 24 24, default !important;
      }

      body[data-cursor-view="photography"],
      body[data-cursor-view="photography"] * {
        cursor: url("images/camera-cursor.png") 24 24, default !important;
      }

      /* Fires on the cursor icon itself: opening a photo swaps the camera
         cursor for the same emoji with its flash bulb lit, for one beat,
         as if it just took the shot. The extra class outranks the rule
         above on specificity while both stay !important. */
      body.is-camera-flash[data-cursor-view="photography"],
      body.is-camera-flash[data-cursor-view="photography"] * {
        cursor: url("images/camera-cursor-flash.png") 24 24, default !important;
      }
    }

    /* fixed, full-viewport backdrop layers — crossfaded on navigation so the
       page never hard-cuts between the light and photography (dark) themes */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transition: opacity .9s var(--ease);
      /* rendered larger than the viewport so it can slowly pan without ever
         showing an edge — the "water" drift lives in background-position.
         First layer (grain) stays at its native tile size — scaling it up
         with the rest would stretch the fine noise into coarse blotches. */
      background-size: 220px 220px, 140% 140%, 140% 140%, 140% 140%, 140% 140%, 140% 140%;
      background-position: 50% 50%;
    }

    /* very subtle, slow drift — like a slow tide, not an obvious animation */
    @media (prefers-reduced-motion: no-preference) {
      .bg-layer {
        animation: bg-drift 48s ease-in-out infinite;
      }
    }

    @keyframes bg-drift {
      0% {
        background-position: 50% 50%;
      }

      25% {
        background-position: 57% 54%;
      }

      50% {
        background-position: 53% 60%;
      }

      75% {
        background-position: 45% 55%;
      }

      100% {
        background-position: 50% 50%;
      }
    }

    .bg-light {
      opacity: 1;
      background-color: #f4fdfb;
      background-image:
        /* Subtle aesthetic grain overlay — keeps the depth from reading flat */
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E"),
        /* Bright key-light in the upper-left to keep the canvas feeling clean */
        radial-gradient(52% 45% at 18% 12%, rgba(255, 255, 255, .95) 0%, rgba(255, 255, 255, 0) 72%),
        /* Two large, soft teal mesh blobs — the primary depth cue */
        radial-gradient(78% 62% at 96% 4%, rgba(6, 148, 148, .38) 0%, rgba(6, 148, 148, 0) 58%),
        radial-gradient(85% 65% at -4% 98%, rgba(4, 104, 104, .34) 0%, rgba(4, 104, 104, 0) 60%),
        /* Smaller mid-tone accent to break up the negative space */
        radial-gradient(46% 40% at 78% 78%, rgba(6, 148, 148, .20) 0%, rgba(6, 148, 148, 0) 68%),
        /* Ambient vertical base so the blobs have somewhere to sit */
        linear-gradient(165deg, #fbfffe 0%, #eafaf6 45%, #d3f0e8 100%);
    }

    .bg-dark {
      opacity: 0;
      background-color: #081615;
      background-image:
        /* Same grain as the light theme — same texture, just the color changes */
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E"),
        /* Dim teal key-light, upper-left — same position as the light theme's white glow */
        radial-gradient(52% 45% at 18% 12%, rgba(6, 148, 148, .30) 0%, rgba(6, 148, 148, 0) 72%),
        /* Two large teal mesh blobs, same geometry as the light theme, brighter for contrast against near-black */
        radial-gradient(78% 62% at 96% 4%, rgba(6, 148, 148, .48) 0%, rgba(6, 148, 148, 0) 60%),
        radial-gradient(85% 65% at -4% 98%, rgba(6, 148, 148, .40) 0%, rgba(6, 148, 148, 0) 62%),
        /* Smaller mid-tone accent, bottom-right */
        radial-gradient(46% 40% at 78% 78%, rgba(6, 148, 148, .22) 0%, rgba(6, 148, 148, 0) 70%),
        /* Near-black ambient base with a whisper of deep teal */
        linear-gradient(165deg, #0a1615 0%, #08211f 45%, #062e2b 100%);
    }

    body.is-photography {
      color: #eefaf8;
    }

    body.is-photography .bg-light {
      opacity: 0;
    }

    body.is-photography .bg-dark {
      opacity: 1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* =========================================================================
   VIEW SWITCHING  (home  <->  project detail)
   Phase 2 fills in the detail view; Phase 3 fills in the gallery.
   ========================================================================= */
    .view {
      display: none;
    }

    .view.is-active {
      display: block;
    }

    /* =========================================================================
   HOME / HERO
   ========================================================================= */
    .hero {
      height: 100svh;
      max-width: var(--maxw);
      margin-inline: auto;
      padding: clamp(1.25rem, 3vw, 2.5rem) var(--gutter) clamp(1.5rem, 3vw, 3rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* top line: location + email */
    .hero__contact {
      position: relative;
      z-index: 3;
      font-size: clamp(.72rem, 1vw, .85rem);
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      line-height: 1.25;
      margin-top: clamp(1rem, 3vw, 2rem);
    }

    .hero__contact .loc {
      color: var(--ink);
    }

    .hero__contact .mail {
      color: var(--sub);
      display: block;
    }

    .hero__contact .mail:hover {
      color: var(--teal);
    }

    /* the name — the loudest thing on the page */
    .hero__name {
      position: relative;
      z-index: 3;
      font-weight: 700;
      font-size: clamp(2.5rem, 10vw, 8.5rem);
      line-height: .92;
      letter-spacing: -.02em;
      margin-top: clamp(1rem, 2.5vw, 2rem);
      text-transform: uppercase;
    }

    /* the floating work gallery lives here */
    .hero__stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      margin: clamp(.75rem, 2vw, 1.5rem) 0;
      position: relative;
      z-index: 1;
    }



    /* scattered thumbnails: item = mouse-parallax layer, orbit = auto-drift */
    .gallery {
      position: absolute;
      inset: 0;
    }

    .gallery__item {
      position: absolute;
      will-change: transform;
      /* JS sets mouse-parallax here */
    }

    .gallery__orbit {
      position: relative;
      width: var(--w);
      transform: translate(-50%, -50%);
      /* centre on the item's point */
      animation: drift var(--dur, 13s) ease-in-out var(--delay, 0s) infinite;
      will-change: transform;
    }

    /* hover shadow lives here as a pre-rendered layer that fades in via
       opacity (compositor-only) — transitioning box-shadow itself repaints
       the big blur on the CPU every frame, which is what made hovering to
       click feel janky */
    .gallery__orbit::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 14px;
      box-shadow: 0 32px 64px rgba(20, 24, 26, .28);
      opacity: 0;
      transition: opacity .25s var(--ease), transform .25s var(--ease);
      pointer-events: none;
    }

    .gallery__item:hover .gallery__orbit::after {
      opacity: 1;
      transform: scale(1.06);
    }

    .gallery__card {
      position: relative;
      display: block;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #eee;
      box-shadow: 0 18px 45px rgba(20, 24, 26, .18);
      transform: rotate(var(--rot, 0deg));
      transition: transform .25s var(--ease);
      will-change: transform;
      cursor: pointer;
    }

    .gallery__card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery__card .imgfallback {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }

    .gallery__item:hover {
      z-index: 30;
    }

    .gallery__item:hover .gallery__orbit {
      animation-play-state: paused;
    }

    .gallery__item:hover .gallery__card {
      transform: rotate(0deg) scale(1.06);
    }

    .gallery__cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: .9rem .8rem .7rem;
      font-size: .82rem;
      font-weight: 500;
      color: #fff;
      background: linear-gradient(transparent, rgba(0, 0, 0, .55));
      opacity: 0;
      transition: opacity .3s var(--ease);
    }

    .gallery__card:hover .gallery__cap {
      opacity: 1;
    }

    /* slow, wide orbits so the collage breathes; two variants so nothing syncs */
    @keyframes drift {

      0%,
      100% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      25% {
        transform: translate(calc(-50% + 12px), calc(-50% - 18px)) rotate(1.2deg);
      }

      50% {
        transform: translate(calc(-50% - 10px), calc(-50% - 5px)) rotate(-1deg);
      }

      75% {
        transform: translate(calc(-50% + 6px), calc(-50% + 14px)) rotate(0.7deg);
      }
    }

    @keyframes drift2 {

      0%,
      100% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      33% {
        transform: translate(calc(-50% - 14px), calc(-50% + 10px)) rotate(-1.2deg);
      }

      66% {
        transform: translate(calc(-50% + 11px), calc(-50% - 12px)) rotate(1deg);
      }
    }

    /* the role — big, light grey, sits under the work */
    .hero__role {
      position: relative;
      z-index: 3;
      font-weight: 700;
      font-size: clamp(1.6rem, 6vw, 4.5rem);
      line-height: 1.0;
      letter-spacing: -.01em;
      color: var(--muted);
      text-transform: uppercase;
    }

    @media (max-width:640px) {
      .hero {
        height: 100svh;
      }
    }

    /* =========================================================================
   PROJECT DETAIL  —  gradient hero + parallax, then /arc two-column body
   ========================================================================= */
    html {
      scroll-behavior: smooth;
    }

    .detail {
      position: relative;
      overflow-x: clip;
      background: #ffffff;
      min-height: 100vh;
    }

    /* full-bleed gradient hero — ALSO the clipping mask for the rising images */
    .detail__band {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 100svh;
      z-index: 0;
      overflow: hidden;
      background: var(--grad, linear-gradient(120deg, #c9b8f0, #efb8d0 60%, #f6cfd6));
    }

    .band__inner {
      position: relative;
      height: 100%;
      max-width: var(--maxw);
      margin-inline: auto;
      padding: 0 var(--gutter);
    }

    .detail__grid {
      position: relative;
      z-index: 1;
      max-width: var(--maxw);
      margin-inline: auto;
      padding: 0 var(--gutter) clamp(4rem, 10vw, 8rem);
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      column-gap: clamp(2.5rem, 7vw, 7rem);
    }

    /* --- left sticky menu: spans hero + content --- */
    .detail__nav {
      grid-column: 1;
      grid-row: 1 / -1;
      position: sticky;
      top: clamp(1.5rem, 3vw, 2.5rem);
      align-self: start;
      z-index: 4;
      margin-top: clamp(2.5rem, 10vh, 7.5rem);
    }

    /* In Hero: White text for high contrast on gradient */
    .detail__back {
      display: inline-block;
      font-size: .95rem;
      font-weight: 500;
      line-height: 1.2;
      color: rgba(255, 255, 255, .95);
      margin-bottom: clamp(2rem, 4vw, 3rem);
      transition: color .3s var(--ease), opacity .2s var(--ease);
    }

    .detail__back:hover {
      opacity: .75;
      color: #fff;
    }

    .detail__menu {
      display: flex;
      flex-direction: column;
      gap: .85rem;
    }

    .detail__menu a {
      font-size: 1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, .65);
      transition: color .3s var(--ease);
      width: fit-content;
    }

    .detail__menu a:hover {
      color: #ffffff;
    }

    .detail__menu a.active {
      color: #ffffff;
      font-weight: 500;
    }

    /* Scrolled past hero section: Black/Dark text on white background with teal interactive accents */
    .detail__nav.is-scrolled .detail__back {
      color: var(--ink);
    }

    .detail__nav.is-scrolled .detail__back:hover {
      opacity: 1;
      color: var(--teal);
    }

    .detail__nav.is-scrolled .detail__menu a {
      color: var(--sub);
    }

    .detail__nav.is-scrolled .detail__menu a:hover {
      color: var(--teal);
    }

    .detail__nav.is-scrolled .detail__menu a.active {
      color: var(--teal);
      font-weight: 600;
    }

    /* headline + eyebrow + blurb live as a unified block, aligned at the top with the nav back button */
    .hero-text {
      position: absolute;
      left: 0;
      right: 0;
      top: clamp(2.5rem, 10vh, 7.5rem);
      padding-inline: var(--gutter);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      z-index: 1;
      /* BEHIND the images */
    }

    .hero-eyebrow {
      margin-inline: auto;
      text-align: center;
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .85);
      margin-bottom: 21px;
    }

    .hero-headline {
      margin-inline: auto;
      text-align: center;
      max-width: 22ch;
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 5vw, 4.75rem);
      line-height: 1.06;
      letter-spacing: -.01em;
      color: #fff;
      margin-bottom: clamp(14px, 2vh, 20px);
    }

    .hero-sub {
      margin-bottom: 0;
      margin-inline: auto;
      text-align: center;
      max-width: min(90vw, 72ch);
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.45;
      color: rgba(255, 255, 255, .9);
    }

    /* --- HERO MEDIA BASE ---
       A fixed-height band that extends BELOW the gradient clip.
       On scroll, initParallax translates this container smoothly upwards. */
    .hero-media {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -30vh;
      height: 79vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
      will-change: transform;
    }

    .hero-card {
      height: 100%;
      border-radius: 16px 16px 0 0;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 24px 60px rgba(30, 20, 60, .22);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease);
    }

    .hero-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-card .imgfallback {
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }

    /* === HERO STYLE 1: TRIO (Classic Overlapping 3-Card Stack) === */
    .hero-media--trio .hero-card,
    .hero-media:not([class*="hero-media--"]) .hero-card {
      width: clamp(170px, 23vw, 340px);
    }

    .hero-media--trio .hero-card:nth-child(1),
    .hero-media:not([class*="hero-media--"]) .hero-card:nth-child(1),
    .hero-card--trio-1 {
      transform: translateY(26px) scale(.87);
      z-index: 1;
      margin-right: -30px;
    }

    .hero-media--trio .hero-card:nth-child(2),
    .hero-media:not([class*="hero-media--"]) .hero-card:nth-child(2),
    .hero-card--trio-2 {
      z-index: 3;
    }

    .hero-media--trio .hero-card:nth-child(3),
    .hero-media:not([class*="hero-media--"]) .hero-card:nth-child(3),
    .hero-card--trio-3 {
      transform: translateY(26px) scale(.87);
      z-index: 1;
      margin-left: -30px;
    }

    /* === HERO STYLE: TRIO-SVG (Three Freely Positioned SVGs / Graphics) === */
    .hero-media--trio-svg {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      height: 100%;
      pointer-events: none;
    }

    .hero-trio__item {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .3s var(--ease);
    }

    .hero-trio__item img,
    .hero-trio__item svg {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.18));
    }

    /* =========================================================================
       TRIO-SVG item positions are now set per-project via heroPos[].
       Only structural / transition rules live here.
       ========================================================================= */
    .hero-trio__item--1 {
      z-index: 2;
    }

    .hero-trio__item--2 {
      z-index: 3;
    }

    .hero-trio__item--3 {
      z-index: 2;
    }

    /* === HERO STYLE 2: SINGLE (Freely Positioned Single SVG / Graphic) === */
    .hero-media--single {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      height: 100%;
      pointer-events: none;
    }

    .hero-single__item {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .3s var(--ease);
    }

    .hero-single__item img,
    .hero-single__item svg {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.18));
    }

    /* =========================================================================
       SINGLE-SVG item positions are now set per-project via heroPos[].
       ========================================================================= */
    .hero-single__item {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .3s var(--ease);
      z-index: 2;
    }

    /* === HERO STYLE 3: DUO (Two Freely Positioned SVGs / Graphics) === */
    .hero-media--duo {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      height: 100%;
      pointer-events: none;
    }

    .hero-duo__item {
      position: absolute;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .3s var(--ease);
    }

    .hero-duo__item img,
    .hero-duo__item svg {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.18));
    }

    /* =========================================================================
       DUO item positions are now set per-project via heroPos[].
       ========================================================================= */
    .hero-duo__item--1 {
      z-index: 3;
    }

    .hero-duo__item--2 {
      z-index: 2;
    }

    /* === HERO STYLE 4: SPREAD (Fanned-out Multi-Card Horizon) === */
    .hero-media--spread {
      gap: 0;
    }

    .hero-media--spread .hero-card,

    /* === HERO STYLE 5: DEVICE (Realistic Smartphone Mockup Frame) === */
    .hero-media--device {

    .detail__main {

    /* multi-image sections: a small responsive gallery instead of one figure */
    .section-gallery {

    /* photo-essay sections (lots of images): a repeating mosaic rhythm —

    .section-mosaic {

    /* --- shelf section: no more dark card, sits directly on the page bg --- */
    /* --- shelf section: no more dark card, sits directly on the page bg --- */
    .shelf-stack {

      margin-bottom: clamp(1rem, 2vw, 1.5rem);
    }

    /* Styled after the "digital bookshelf" reference: flat paper spines with
       rough hand-cut edges standing on an invisible baseline — no drawn
       shelf. A selected spine pulls out into its real front cover (with a
       readable spine edge) while neighbours lean away, and its note stays
       anchored below the shelf instead of interrupting the row. */
    .shelf-unified {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      overflow-x: auto;
      /* Without an explicit overflow-y, the spec computes it to `auto`
         too whenever overflow-x isn't `visible` — so this row could pick
         up its own vertical scrollbar/scroll capture (e.g. a trackpad
         swipe meant to scroll the page gets caught by the shelf instead)
         the moment its content's rendered height, including any leaning
         or popped-open spine, nudges past the row's own box. Locking it
         to hidden keeps only the intended left-right scroll. */
      overflow-y: hidden;
      /* Generous right slack: a spine expands rightward from its own fixed
         left edge, so a book near the end of the row needs somewhere to
         scroll into or its far (3D-popped) corner has nowhere to go but
         off the edge of this row's own scroll viewport. Left slack matters
         too: opening any spine tips its left neighbours away (leaning
         left, see applyLean) by up to ~6.5°, which shifts a ~330px-tall
         spine's top corner roughly 40px further left than its resting
         box — with only a few px of padding that tipped top edge gets
         clipped by this row's own scroll boundary, i.e. the FIRST book
         visibly getting cut off the moment you open the second or third
         one. */
      padding: 42px clamp(90px, 22vw, 200px) 18px clamp(48px, 10vw, 90px);
      scrollbar-width: thin;
      position: relative;
      z-index: 1;
    }

    .shelf-unified::-webkit-scrollbar {
      height: 7px;
    }

    .shelf-unified::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, .15);
      border-radius: 4px;
    }

    .spine {
      position: relative;
      flex: 0 0 64px;
      width: 64px;
      height: var(--h, 320px);
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      color: var(--ink-on, #eee);
      perspective: 1100px;
      overflow: visible;
      transform-origin: center bottom;
      /* --lean is set from JS on neighbours of an opened book so they tip
         over as if physically pushed; bottom origin keeps feet planted */
      transform: rotate(var(--lean, 0deg));
      transition: width .48s cubic-bezier(.22, 1, .36, 1),
        flex-basis .48s cubic-bezier(.22, 1, .36, 1), transform .45s var(--ease);
    }

    /* The shadow must follow the rough clip-path cut, so the drop-shadow
       lives here while the clip + paint live on the inner paper layer —
       filter applied after clip-path on the same element would clip the
       shadow away. */
    .spine__surface {
      position: absolute;
      inset: 0;
      filter: drop-shadow(0 8px 9px rgba(10, 20, 20, .24));
      transform-origin: right center;
      backface-visibility: hidden;
      transition: transform .42s cubic-bezier(.22, 1, .36, 1), opacity .2s ease;
    }

    .spine__paper {
      position: absolute;
      inset: 0;
      background-color: var(--c, #33415a);
      background-image: linear-gradient(90deg, rgba(0, 0, 0, .10), transparent 14%, transparent 86%, rgba(0, 0, 0, .16));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 4px;
      overflow: hidden;
      transition: background-color .6s ease, color .6s ease;
    }

    /* Opened book: a true 3D volume — front cover, spine face, and a
       page-block sliver at the fore-edge — pulled out of the row and
       turned to a three-quarter angle so the side profile stays visible,
       like the reference. The wrapper carries its own perspective (an
       ancestor's perspective property only reaches direct children), and
       must NOT have overflow or filter: either would flatten the 3D. */
    .spine__cover {
      position: absolute;
      left: 0;
      bottom: 0;
      width: var(--cover-w, 236px);
      height: 100%;
      perspective: 750px;
      text-align: left;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      --depth: 26px;
    }

    /* soft cast shadow on the shelf under the volume */
    .spine__cover::after {
      content: '';
      position: absolute;
      left: 2%;
      right: 18%;
      bottom: -8px;
      height: 16px;
      background: radial-gradient(ellipse at 38% 50%, rgba(10, 20, 20, .34), transparent 70%);
      opacity: 0;
      transition: opacity .4s ease .12s;
    }

    /* Swings around its spine: edge-on in the shelf (only the spine face
       toward the viewer, continuous with the flat paper spine it replaces)
       out to the three-quarter reading angle. */
    .spine__cover-book {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transform: rotateY(86deg);
      transition: transform .55s cubic-bezier(.22, 1, .36, 1);
    }

    /* spine face: a real side plane rotated 90° out of the cover plane */
    .spine__cover-edge {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--depth, 26px);
      height: 100%;
      transform-origin: left center;
      transform: rotateY(-90deg);
      background-color: var(--c, #33415a);
      background-image: linear-gradient(90deg, rgba(0, 0, 0, .22), rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .26));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 2px 0 0 2px;
    }

    .spine__cover-edge-title {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Jost', sans-serif;
      font-size: .5rem;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
      max-height: 92%;
      overflow: hidden;
      color: var(--ink-on, #eee);
      opacity: .9;
    }

    .spine__cover-front {
      position: absolute;
      inset: 0;
      transform: translateZ(var(--depth, 26px));
      backface-visibility: hidden;
      border-radius: 2px 5px 5px 2px;
      background-color: var(--c, #33415a);
      background-image: linear-gradient(125deg, rgba(255, 255, 255, .18), transparent 34%),
        linear-gradient(160deg, transparent 55%, rgba(0, 0, 0, .24));
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: .6rem;
      padding: clamp(1rem, 1.8vw, 1.4rem);
      /* crease shadow where the cover meets the spine, plus a hairline */
      box-shadow: inset 7px 0 10px -4px rgba(0, 0, 0, .38), 0 0 0 1px rgba(0, 0, 0, .08);
    }

    /* page-block sliver along the fore-edge of a hardcover */
    .spine--book .spine__cover-front::after {
      content: '';
      position: absolute;
      top: 2px;
      bottom: 2px;
      right: 0;
      width: 4px;
      background: repeating-linear-gradient(180deg, #efe9d8 0 2px, #d9d1bc 2px 3px);
      border-radius: 0 4px 4px 0;
    }

    .spine__cover-copy {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    .spine__cover-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .spine__cover-author {
      font-family: 'Jost', sans-serif;
      font-size: .62rem;
      line-height: 1.35;
      letter-spacing: .09em;
      text-transform: uppercase;
      opacity: .82;
    }

    /* Real cover art, once fetched, replaces the designed front entirely —
       the reference shows the untouched artwork, no scrim or overlay text.
       Titles without art keep the designed front above as a fallback. */
    .spine__cover.has-cover .spine__cover-front {
      background-image: var(--cover-img);
    }

    .spine__cover.has-cover .spine__cover-copy {
      display: none;
    }

    .spine.is-active {
      z-index: 5;
      flex-basis: var(--cover-w, 236px);
      width: var(--cover-w, 236px);
      transform: translateY(-6px);
    }

    .spine.is-active .spine__surface {
      opacity: 0;
      transform: translateX(-10px) rotateY(74deg);
    }

    .spine.is-active .spine__cover {
      opacity: 1;
      transform: rotate(-1.2deg);
    }

    .spine.is-active .spine__cover::after {
      opacity: 1;
    }

    /* three-quarter angle: positive rotateY brings the left (spine) face
       toward the viewer while the cover recedes — the 45°-ish pose */
    .spine.is-active .spine__cover-book {
      transform: rotateY(40deg);
    }

    /* Title-only spine text, reading bottom-to-top in spaced uppercase
       sans — the reference keeps spines minimal: no author, no logo. */
    .spine__title {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: .67rem;
      line-height: 1.2;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
      max-height: calc(100% - 8px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CJK glyphs already sit upright and top-to-bottom in vertical-rl —
       the 180deg flip above exists only to turn *Latin* text so it reads
       bottom-to-top like a Western spine, and applying it to CJK instead
       mirrors each character and reverses the reading order. */
    .spine--cjk .spine__title,
    .spine--cjk .spine__cover-edge-title {
      transform: none;
      letter-spacing: .3em;
    }

    /* Films reuse the book spine's shape wholesale — same rough-cut flat
       rectangle, same top-edge treatment, same type scale — rather than a
       bespoke silhouette (DVD case, rolled tube, etc). The only visual
       differentiators are the fill colour and, when art has loaded, a
       thin strip of the poster's own artwork along the top sitting above
       a solid block in a tone pulled from that same poster. */
    .spine--dvd {
      flex: 0 0 42px;
      width: 42px;
      --cover-w: 206px;
      --art-strip: 15%;
    }

    .spine--dvd.has-cover .spine__paper {
      background-image: var(--cover-img),
        linear-gradient(90deg, rgba(0, 0, 0, .10), transparent 14%, transparent 86%, rgba(0, 0, 0, .16));
      background-size: 100% var(--art-strip), 100% 100%;
      background-position: top, top;
      background-repeat: no-repeat, no-repeat;
    }

    .spine--dvd.has-cover .spine__paper::before {
      content: '';
      position: absolute;
      top: calc(var(--art-strip) - 3px);
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(180deg, rgba(0, 0, 0, .25), transparent);
      pointer-events: none;
    }

    .spine--dvd .spine__cover {
      --depth: 14px;
    }

    .spine--dvd .spine__cover-front {
      border-radius: 2px;
    }

    .spine--dvd .spine__cover-edge {
      border-radius: 1px 0 0 1px;
    }

    .spine--dvd .spine__cover-edge-title {
      font-size: .44rem;
      letter-spacing: .1em;
    }

    .spine--dvd .spine__cover-front::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, rgba(255, 255, 255, .20) 0%, rgba(255, 255, 255, .05) 18%, transparent 30%);
    }

    .spine--dvd .spine__cover-title {
      font-family: 'Jost', sans-serif;
      font-size: clamp(1rem, 1.7vw, 1.35rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -.015em;
    }

    /* A film pulls out like a rolled poster, not a hinged book: no side
       profile (a poster has none), and instead of swinging open on a
       spine it unfurls top-to-bottom via a clip-path reveal — the actual
       pixels never stretch or scale, they're just progressively uncovered
       — while a curled shadow bar standing in for the still-rolled part
       flattens away as the reveal finishes. */
    .spine--dvd .spine__cover-edge {
      display: none;
    }

    .spine--dvd .spine__cover-book {
      transform: none;
      transition: none;
    }

    .spine--dvd .spine__cover-front {
      left: 0;
      transform: none;
      clip-path: inset(0 0 100% 0 round 2px);
      transition: clip-path .62s cubic-bezier(.22, 1, .36, 1);
    }

    .spine--dvd .spine__cover-front::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: linear-gradient(180deg, rgba(0, 0, 0, .42), transparent);
      opacity: 1;
      transition: opacity .3s ease .32s;
    }

    .spine.is-active.spine--dvd .spine__cover-front {
      clip-path: inset(0 0 0% 0 round 2px);
    }

    .spine.is-active.spine--dvd .spine__cover-front::before {
      opacity: 0;
    }

    /* cancel the book's hinge-turn — a poster has nothing to turn on */
    .spine.is-active.spine--dvd .spine__cover-book {
      transform: none;
    }

    .spine:not(.is-active):hover {
      transform: translateY(-8px) rotate(var(--lean, 0deg));
    }

    .spine:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 5px;
    }

    .shelf-note {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height .45s cubic-bezier(.22, 1, .36, 1), opacity .28s ease,
        transform .45s cubic-bezier(.22, 1, .36, 1), margin-top .45s cubic-bezier(.22, 1, .36, 1);
    }

    .shelf-note.is-open {
      max-height: 240px;
      margin-top: clamp(1.4rem, 2.6vw, 2rem);
      opacity: 1;
      transform: translateY(0);
    }

    .book-note__title {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.75rem, 4vw, 3rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -.025em;
      color: var(--ink);
    }

    .book-note__quote {
      margin-top: .85rem;
      font-size: clamp(.95rem, 1.25vw, 1.08rem);
      line-height: 1.55;
      color: var(--ink);
      max-width: 900px;
    }

    .book-note__meta {
      margin-top: .4rem;
      font-size: .74rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--sub);
      font-weight: 500;
      line-height: 1.35;
    }

    .shelf-hint {
      margin-top: clamp(1.2rem, 2.4vw, 1.8rem);
      font-family: 'Jost', sans-serif;
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--sub);
    }

    @media (max-width:760px) {
      .spine {
        flex: 0 0 56px;
        width: 56px;
      }

      .spine--book {
        --cover-w: 172px;
      }

      .spine--dvd {
        flex: 0 0 34px;
        width: 34px;
        --cover-w: 156px;
      }

      .spine__cover-front {
        padding: 1rem;
      }

      .spine__cover {
        --depth: 20px;
      }

      .spine--dvd .spine__cover {
        --depth: 11px;
      }

      .spine__cover-title {
        font-size: 1.15rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .spine,
      .spine__surface,
      .spine__cover,
      .spine__cover-book,
      .shelf-note {
        transition-duration: .01ms;
      }
    }

    /* =========================================================================
   INTRO OVERLAY  — 3D floating collage, blurred hero behind, click to enter
   ========================================================================= */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(250, 250, 250, .35);
      cursor: pointer;
      transition: opacity .9s var(--ease);
    }

    .intro.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* blur + gently scale the hero while the intro is open, then resolve in */
    body.intro-open #home {
      filter: blur(18px);
      transform: scale(1.03);
    }

    #home {
      transition: filter .9s var(--ease), transform .9s var(--ease);
    }

    .intro__cloud {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 1300px;
    }

    .intro__stage3d {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: cloudSpin 30s ease-in-out infinite;
    }

    .intro__img {
      position: absolute;
      width: var(--w);
      transform: translate(-50%, -50%) translateZ(var(--z, 0px)) rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
      will-change: transform;
    }

    .intro__floaty {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 26px 64px rgba(20, 24, 44, .24);
      aspect-ratio: 4/5;
      animation: floatZ var(--dur, 12s) ease-in-out var(--delay, 0s) infinite;
    }

    .intro__floaty img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .intro__floaty .imgfallback {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
    }

    .intro__center {
      position: relative;
      z-index: 2;
      text-align: center;
      pointer-events: none;
      padding: 0 1.5rem;
    }

    .intro__welcome {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.9rem, 4.2vw, 3.6rem);
      line-height: 1.12;
      letter-spacing: -.01em;
      color: var(--ink);
      text-shadow: 0 2px 30px rgba(250, 250, 250, .9);
    }

    .intro__hint {
      display: inline-block;
      margin-top: 1.8rem;
      padding: .7rem 1.4rem;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink);
      background: rgba(255, 255, 255, .55);
      animation: hintPulse 2.2s ease-in-out infinite;
    }

    @keyframes cloudSpin {

      0%,
      100% {
        transform: rotateY(-7deg) rotateX(1.6deg);
      }

      50% {
        transform: rotateY(7deg) rotateX(-1.6deg);
      }
    }

    @keyframes floatZ {

      0%,
      100% {
        transform: translate(0, 0);
      }

      33% {
        transform: translate(7px, -13px);
      }

      66% {
        transform: translate(-9px, 7px);
      }
    }

    @keyframes hintPulse {

      0%,
      100% {
        opacity: .72;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width:760px) {
      .intro__img {
        width: clamp(84px, 22vw, 150px) !important;
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .intro__stage3d,
      .intro__floaty,
      .intro__hint {
        animation: none;
      }
    }

    /* =========================================================================
       PHOTOGRAPHY PAGE
       ========================================================================= */
    .photog {
      max-width: var(--maxw);
      margin-inline: auto;
      padding: clamp(6rem, 13vh, 9rem) var(--gutter) clamp(4rem, 10vw, 7rem);
    }

    .photog__head {
      margin-bottom: clamp(2.5rem, 5vw, 4rem);

    .photog__head h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);

      letter-spacing: -.02em;
      text-transform: uppercase;

    .photog__head p {
      margin-top: .8rem;
      color: #9fd8d0;
      font-size: clamp(1rem, 1.4vw, 1.2rem);
    }

    /* --- Masonry (CSS columns) --- */
    .photog__grid {
      columns: 4;
      column-gap: 6px;
    }

    .photog__img {
      width: 100%;
      display: block;
      min-height: 80px;
      /* ensures layout space before image loads */
      margin-bottom: 6px;
      break-inside: avoid;
      border-radius: 3px;
      cursor: zoom-in;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .55s ease, transform .55s ease;
    }

    .photog__img.is-visible {
      opacity: 1;
      transform: none;
    }

    .photog__img.is-visible:hover {
      opacity: .88;
    }

    .photog__signoff {
      margin-top: clamp(3rem, 6vw, 5rem);
      padding-bottom: clamp(2rem, 4vw, 3rem);
      text-align: center;
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      color: #9fd8d0;
      letter-spacing: .01em;
    }

    @media (max-width: 900px) {
      .photog__grid {
        columns: 2;
      }
    }

    @media (max-width: 520px) {
      .photog__grid {
        columns: 1;
      }
    }

    /* --- Photography Lightbox --- */
    .photog__lb {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .93);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    .photog__lb.is-open {
      display: flex;
    }

    .photog__lb img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .6);
    }

  </style>

    /* ---- real cover art for the shelf ----
       Resolves to a Wikipedia page image (public, keyless REST API) using
       the `wiki` field on each entry, which names the exact, hand-verified
       article — a fuzzy title search was tried first but occasionally
       matched an unrelated page (e.g. a person's portrait for a book with
       no dedicated article), which reads worse than no cover at all, so
       entries without a `wiki` field simply keep their designed spine.
       Results are cached per title so a re-render never re-fetches, and
       requests run a few at a time so a full shelf of ~30 items doesn't
       trip Wikimedia's rate limit. */
    const COVER_CACHE = new Map();

    /* Resolves to the loaded <img> itself (not just its src) so the same
       element can be sampled for a dominant colour below without a second
       network fetch. crossOrigin is required to read pixels off the image
       at all — but a source without permissive CORS headers (some of the
       manually-sourced covers, unlike Wikimedia's) will then fail to load
       outright, so a second attempt without it lets the cover still show;
       colour extraction just quietly finds a tainted canvas and skips. */
    function preloadImage(src) {
      if (!src) return Promise.resolve(null);
      return new Promise(resolve => {
        const attempt = anon => {
          const img = new Image();
          if (anon) img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => anon ? attempt(false) : resolve(null);
          img.src = src;
        };
        attempt(true);
      });
    }

    /* Samples a downscaled copy of the cover on a canvas and finds its most
       prominent *vivid* colour, bucketed by quantized RGB and scored by
       HSV saturation — not HSL saturation, which is unreliable near the
       lightness extremes: a barely-tinted pastel pixel like (252,218,208)
       reports HSL saturation of ~0.88 (it divides chroma by a shrinking
       range as lightness approaches 1), so it can outscore genuinely vivid
       pixels and get treated as the cover's defining colour when it isn't
       one. HSV saturation ((max-min)/max) doesn't have that blowup. The
       winning bucket's own averaged RGB is returned as-is — a small
       quantized cluster of real sampled pixels, not a colour rebuilt from
       just its hue — so the spine ends up tinted with an actual colour
       from the cover. Returns null (silently) if the canvas is tainted or
       the image had no usable pixels. */
    function deriveSpineColor(img) {
      try {
        const w = 40, h = 54;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;

        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] < 128) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const v = max / 255;
          const sat = max === 0 ? 0 : (max - min) / max;
          if (v > 0.95 || v < 0.08 || sat < 0.2) continue;
          const key = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4);
          let bucket = buckets.get(key);
          if (!bucket) { bucket = { count: 0, r: 0, g: 0, b: 0, sat: 0, v: 0 }; buckets.set(key, bucket); }
          bucket.count++; bucket.r += r; bucket.g += g; bucket.b += b; bucket.sat += sat; bucket.v += v;
        }
        if (!buckets.size) return null;

        let best = null, bestScore = -1;
        for (const bucket of buckets.values()) {
          const score = bucket.count * (0.5 + bucket.sat / bucket.count);
          if (score > bestScore) { bestScore = score; best = bucket; }
        }

        // Use the winning bucket's own sampled colour as-is — it's the
        // average of a small quantized cluster of real pixels, so it's
        // (very close to) an actual colour from the cover, not a colour
        // invented from just its hue. An earlier version kept only the
        // hue and rebuilt the rest from a fixed saturation/lightness
        // formula, which routinely produced a tone that never appeared
        // anywhere in the source image.
        const rr = Math.round(best.r / best.count);
        const gg = Math.round(best.g / best.count);
        const bb = Math.round(best.b / best.count);
        const hex = '#' + [rr, gg, bb].map(v => v.toString(16).padStart(2, '0')).join('');
        const luminance = (0.299 * rr + 0.587 * gg + 0.114 * bb) / 255;
        const ink = luminance > 0.58 ? '#241a08' : '#f4efe2';
        return { hex, ink };
      } catch { return null; }
    }

    async function wikiSummary(pageTitle) {
      const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle.replace(/ /g, '_'))}`);
      if (!res.ok) return null;
      const data = await res.json();
      return data?.originalimage?.source || data?.thumbnail?.source || null;
    }

    function fetchCover(m) {
      // `cover` is a hand-sourced direct image URL, used for titles with no
      // usable Wikipedia article; it always wins over a `wiki` lookup.
      if (m.cover) return Promise.resolve(m.cover);
      if (!m.wiki) return Promise.resolve(null);
      const key = `${m.type}:${m.wiki}`;
      if (COVER_CACHE.has(key)) return COVER_CACHE.get(key);
      const p = wikiSummary(m.wiki).catch(() => null);
      COVER_CACHE.set(key, p);
      return p;
    }

    /* Runs async tasks with at most `limit` in flight at once. */
    function runWithConcurrency(tasks, limit) {
      let i = 0;
      const workers = new Array(Math.min(limit, tasks.length)).fill(0).map(async () => {
        while (i < tasks.length) {
          const task = tasks[i++];
          await task();
        }
      });
      return Promise.all(workers);
    }

    /* Fetches + preloads real art for every book/film spine, then swaps it
       into that spine's cover container once it's ready to paint — and
       retints the spine itself (before it's ever clicked) to the cover's
       own dominant colour, so the closed shelf already hints at what's
       behind each spine instead of a colour picked at random. */
    function loadShelfCovers(aboutView, books, films) {
      const applyCover = (kind, i) => async (m) => {
        const img = await preloadImage(await fetchCover(m));
        if (!img) return;
        const spine = aboutView.querySelector(`.spine[data-kind="${kind}"][data-idx="${i}"]`);
        if (!spine) return;
        const cover = spine.querySelector('.spine__cover');
        cover.style.setProperty('--cover-img', `url("${img.src}")`);
        cover.classList.add('has-cover');
        // Also flagged on the spine itself so the resting (closed) film
        // spine's poster-art strip — a plain CSS rule, no JS of its own —
        // can key off `.spine--dvd.has-cover` the same way.
        spine.style.setProperty('--cover-img', `url("${img.src}")`);
        spine.classList.add('has-cover');
        const palette = deriveSpineColor(img);
        if (palette) {
          spine.style.setProperty('--c', palette.hex);
          spine.style.setProperty('--ink-on', palette.ink);
        }
      };
      const tasks = [
        ...books.map((m, i) => () => applyCover('book', i)(m)),
        ...films.map((m, i) => () => applyCover('dvd', i)(m))
      ];
      runWithConcurrency(tasks, 4);
    }
  </script>

    /* depth-based mouse parallax — nearer cards shift more, eased for smoothness */
    (function galleryParallax() {
      if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      if (matchMedia('(max-width:760px)').matches) return;
      const items = [...stage.querySelectorAll('.gallery__item')];
      if (!items.length) return;
      let tx = 0, ty = 0, cx = 0, cy = 0;
      // cache the rect instead of measuring on every mousemove — mousemove can
      // fire 100+ times/sec, and getBoundingClientRect() forces a synchronous
      // layout each time, which is the main source of the jank
      let rect = stage.getBoundingClientRect();
      const refreshRect = () => { rect = stage.getBoundingClientRect(); };
      window.addEventListener('resize', refreshRect);
      window.addEventListener('scroll', refreshRect, { passive: true });
      stage.addEventListener('mousemove', (e) => {
        tx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;   // -1 .. 1
        ty = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
      });
      stage.addEventListener('mouseenter', refreshRect);
      stage.addEventListener('mouseleave', () => { tx = 0; ty = 0; });
      (function loop() {
        // skip work while the home view is hidden (any other page) —
        // no point paying for a rAF loop nobody can see
        if (stage.offsetParent === null) {
          requestAnimationFrame(loop);
          return;
        }
        // higher lerp factor = the cards catch up to the cursor much faster,
        // which is what actually reads as "smooth" rather than "laggy"
        cx += (tx - cx) * 0.09;
        cy += (ty - cy) * 0.09;
        for (const it of items) {
          const d = parseFloat(it.dataset.depth) || 0.5;
          it.style.transform = `translate(${(cx * d * 36).toFixed(2)}px, ${(cy * d * 36).toFixed(2)}px)`;
        }
        requestAnimationFrame(loop);
      })();
    })();

    /* About — books and films begin as shelf spines. Selecting one rotates a
       designed front cover toward the viewer and reveals its note below. */
    function renderAbout() {
      const films = MEDIA_LOG.filter(m => m.type === 'Film');
      const books = MEDIA_LOG.filter(m => m.type === 'Book');

      const bookPal = [
        { c: '#1c2033', ink: '#f2efe4' }, { c: '#d9a53c', ink: '#2a1c05' }, { c: '#1f7a68', ink: '#eafaf3' },
        { c: '#46586b', ink: '#eef2f5' }, { c: '#e4dcc4', ink: '#2c2415' }, { c: '#8a2035', ink: '#fbe9ec' },
        { c: '#6b3fa0', ink: '#f2e9fb' }, { c: '#e0a92e', ink: '#2b1d02' }, { c: '#d6316b', ink: '#fbe6ee' },
        { c: '#0f6a63', ink: '#e3f7f3' }, { c: '#e07a2e', ink: '#2b1503' }, { c: '#5c7284', ink: '#eef3f6' },
        { c: '#c98a95', ink: '#2b1116' }, { c: '#1c2540', ink: '#eef1f7' }
      ];
      const dvdPal = [
        { c: '#17213a', ink: '#dfe6f5' }, { c: '#3a1020', ink: '#f3d9df' }, { c: '#10261c', ink: '#d6efdf' },
        { c: '#241436', ink: '#e4d6f2' }, { c: '#0f2a33', ink: '#d4eef2' }, { c: '#2a2a2a', ink: '#e6e6e6' }
      ];
      // A single fixed height per shelf so every spine's top lines up flat
      // — only the hand-cut edge shape (roughClip below) varies per spine.
      const bookH = [332];
      const dvdH = [306];

      const isCjk = text => /[㐀-鿿豈-﫿぀-ヿ가-힯]/.test(text);

      /* Rough hand-cut paper edge, unique but stable per spine: a jittered
         clip-path polygon from a tiny seeded PRNG so a re-render never
         reshuffles the shapes. */
      const roughClip = seed => {
        let s = seed * 7919 + 13;
        const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
        const p = n => n.toFixed(2) + '%';
        const taperL = rnd() * 2.6, taperR = rnd() * 2.6;
        const pts = [
          [taperL, rnd() * 1.3],
          [100 - taperR, rnd() * 1.3],
          [100 - rnd() * 1.2, 25 + rnd() * 8],
          [100 - rnd() * 1.5, 55 + rnd() * 8],
          [100 - rnd() * 0.8, 84],
          [100, 100],
          [0, 100],
          [rnd() * 0.8, 80],
          [rnd() * 1.5, 52 + rnd() * 8],
          [rnd() * 1.2, 24 + rnd() * 8],
        ];
        return `polygon(${pts.map(([x, y]) => p(x) + ' ' + p(y)).join(', ')})`;
      };

      const spineEl = (m, i, kind, pal, hts) => {
        const p = pal[i % pal.length];
        const h = hts[i % hts.length];
        const cjkClass = isCjk(m.title) ? ' spine--cjk' : '';
        // Films reuse the exact same hand-cut paper treatment as books —
        // just a different seed so the two shelves don't repeat shapes.
        const clip = roughClip(i + (kind === 'book' ? 1 : 101));
        return `<button class="spine spine--${kind}${cjkClass}" style="--c:${p.c}; --ink-on:${p.ink}; --h:${h}px;"
        data-kind="${kind}" data-idx="${i}" aria-label="Show ${m.title}" aria-expanded="false">
        <span class="spine__surface">
          <span class="spine__paper" style="clip-path:${clip}">
            <span class="spine__title">${m.title}</span>
          </span>
        </span>
        <span class="spine__cover" aria-hidden="true">
          <span class="spine__cover-book">
            <span class="spine__cover-edge"><span class="spine__cover-edge-title">${m.title}</span></span>
            <span class="spine__cover-front">
              <span class="spine__cover-copy">
                <span class="spine__cover-title">${m.title}</span>
                <span class="spine__cover-author">${m.by} · ${m.year}</span>
              </span>
            </span>

        </span>
      </button>`;
      };

      aboutView.innerHTML = `
    <section class="about">

        <div class="about__text">
          <h1>About</h1>
          <div class="about__bio">
            ${ABOUT.bio.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('')}

        ${ABOUT.photo ? `<img class="about__photo" src="${ABOUT.photo}" alt="Portrait"
          onerror="this.style.display='none'">` : ''}
      </header>
      ${(books.length || films.length) ? `
      <div class="shelf-stack">
        ${books.length ? `
        <div class="shelf-row">
          <div class="shelf-row__label">Books</div>

            ${books.map((m, i) => spineEl(m, i, 'book', bookPal, bookH)).join('')}
          </div>
          <div class="shelf-note" data-note="books" role="status" aria-live="polite"></div>
        </div>` : ''}
        ${films.length ? `
        <div class="shelf-row">
          <div class="shelf-row__label">Films</div>
          <div class="shelf-unified" data-shelf="films">
            ${films.map((m, i) => spineEl(m, i, 'dvd', dvdPal, dvdH)).join('')}
          </div>
          <div class="shelf-note" data-note="films" role="status" aria-live="polite"></div>
        </div>` : ''}
        <div class="shelf-hint">Click a spine to know more</div>
      </div>` : ''}
    </section>`;

      loadShelfCovers(aboutView, books, films);

      const spines = [...aboutView.querySelectorAll('.spine')];

      // Each shelf keeps its own selection and stable note panel.
      const rowStates = {};
      aboutView.querySelectorAll('.shelf-unified').forEach(row => {
        const key = row.dataset.shelf || 'default';
        rowStates[key] = {
          activeSpine: null,
          note: row.closest('.shelf-row')?.querySelector('.shelf-note') || null
        };
      });

      /* Neighbours of an opened book tip away from it — hardest right next
         to it, settling back upright a few books out — like spines pushed
         aside on a real shelf. */
      function applyLean(row, activeSpine) {
        const rowSpines = [...row.querySelectorAll('.spine')];
        const activeAt = rowSpines.indexOf(activeSpine);
        rowSpines.forEach((sp, i) => {
          const d = i - activeAt;
          if (d === 0) { sp.style.removeProperty('--lean'); return; }
          const mag = Math.max(0, 6.5 - (Math.abs(d) - 1) * 2.4);
          if (!mag) { sp.style.removeProperty('--lean'); return; }
          sp.style.setProperty('--lean', (Math.sign(d) * mag).toFixed(1) + 'deg');
        });
      }

      function clearLean(row) {
        row.querySelectorAll('.spine').forEach(sp => sp.style.removeProperty('--lean'));
      }

      function closeRowNote(state) {
        if (state.activeSpine) {
          const row = state.activeSpine.closest('.shelf-unified');
          if (row) clearLean(row);
          state.activeSpine.classList.remove('is-active');
          state.activeSpine.setAttribute('aria-expanded', 'false');
        }
        state.activeSpine = null;
        if (state.note) state.note.classList.remove('is-open');
      }

      spines.forEach(s => {
        s.addEventListener('click', () => {
          const shelfRow = s.closest('.shelf-unified');
          const key = shelfRow ? (shelfRow.dataset.shelf || 'default') : 'default';
          const state = rowStates[key];
          if (!state) return;

          const wasActive = s === state.activeSpine;

          if (wasActive) {
            closeRowNote(state);
            return;
          }

          closeRowNote(state);
          s.classList.add('is-active');
          s.setAttribute('aria-expanded', 'true');
          state.activeSpine = s;
          if (shelfRow) applyLean(shelfRow, s);

          const isBook = s.dataset.kind === 'book';
          const m = (isBook ? books : films)[+s.dataset.idx];
          if (state.note) {
            state.note.innerHTML = `
              <div class="book-note__title">${m.title}</div>
              <div class="book-note__meta">${m.by} · ${m.year}</div>
              <div class="book-note__quote">&ldquo;${m.quote}&rdquo;</div>`;
            state.note.classList.add('is-open');
          }

          // Centering must wait for the spine's width/flex-basis transition
          // to actually finish — reading offsetWidth right after adding
          // is-active (the old double-rAF approach) captures it mid-grow,
          // so the scroll lands short and the 3D cover's popped-out corner
          // hangs off the edge of the row's own scroll viewport with no
          // way to bring it into view. transitionend gives the true final
          // width; the timeout is just a safety net if it never fires.
          const centerOnSpine = () => {
            if (!shelfRow) return;
            const targetLeft = s.offsetLeft - (shelfRow.clientWidth - s.offsetWidth) / 2;
            shelfRow.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
          };
          let centered = false;
          const onGrowEnd = e => {
            if (e.target !== s || (e.propertyName !== 'width' && e.propertyName !== 'flex-basis')) return;
            if (centered) return;
            centered = true;
            s.removeEventListener('transitionend', onGrowEnd);
            centerOnSpine();
          };
          s.addEventListener('transitionend', onGrowEnd);
          setTimeout(() => { if (!centered) { centered = true; s.removeEventListener('transitionend', onGrowEnd); centerOnSpine(); } }, 560);
        });

        s.addEventListener('keydown', event => {
          if (event.key !== 'Escape') return;
          const shelfRow = s.closest('.shelf-unified');
          const key = shelfRow ? (shelfRow.dataset.shelf || 'default') : 'default';
          const state = rowStates[key];
          if (state?.activeSpine === s) {
            closeRowNote(state);
            s.focus();
          }
        });
      });
    }

    /* Work index — grid of every project */
    function renderWork() {
      workView.innerHTML = `
    <section class="work">
      <header class="work__head">
        <h1>Selected Work</h1>
        <p>Every project, in one place.</p>
      </header>
      <div class="work__grid">
        ${PROJECTS.map(p => `
          <a class="work-card" href="#${p.id}">
            <div class="work-card__img">${img(p.cover, p.title)}</div>
            <div class="work-card__meta">
              <span class="work-card__title">${p.title}</span>
              <span class="work-card__blurb">${p.blurb}</span>
            </div>
          </a>`).join('')}
      </div>
    </section>`;
    }

    /* <img> that swaps to a labelled placeholder if the file isn't there yet.
       Pass `group` (the full array of images it belongs to) + `idx` to make it
       openable in the lightbox with the rest of that group as a thumbnail rail. */
    function img(src, alt, group, idx) {
      const lit = group ? ` class="lit" data-imgs='${JSON.stringify(group)}' data-idx="${idx}"` : '';
      return `<img src="${src}" alt="${alt || ''}"${lit}
    onerror="this.replaceWith(Object.assign(document.createElement('div'),`
        + `{className:'imgfallback',textContent:'${src}'}))">`;
    }

    /* Render hero media with dynamic layout per project:
       - 'trio': classic 3 overlapping cards (center elevated) [default]
       - 'single': large centered showcase / desktop screen
       - 'duo': 2 side-by-side staggered cards
       - 'spread': 3-5 cards fanned out with perspective angles
       - 'device': smartphone mockup chassis
       - 'cinematic': wide 16:9 panoramic banner
       - 'custom': raw custom HTML via p.heroHTML
    */
    function renderHeroMedia(p) {
      const style = p.heroStyle || 'trio';
      const extraClass = p.heroClass ? ` ${p.heroClass}` : '';

      // Direct custom HTML override
      if (p.heroHTML) {
        return `<div class="hero-media hero-media--custom${extraClass}">${p.heroHTML}</div>`;
      }

      const sec0 = p.sections && p.sections[0];
      const sec1 = p.sections && p.sections[1];

      // Resolve images array
      let imgs = p.heroImages;
      if (!imgs || !imgs.length) {
        if (style === 'single' || style === 'device' || style === 'cinematic') {
          imgs = [p.cover || (sec0 && sec0.images && sec0.images[0])].filter(Boolean);
        } else if (style === 'duo') {
          imgs = [
            p.heroLeft || p.cover,
            p.heroRight || (sec1 && sec1.images && sec1.images[0]) || (sec0 && sec0.images && (sec0.images[1] || sec0.images[0]))
          ].filter(Boolean);
        } else if (style === 'spread') {
          const allSecImgs = (p.sections || []).flatMap(s => s.images || []);
          imgs = [p.heroLeft, p.cover, p.heroRight, ...allSecImgs].filter(Boolean);
          if (imgs.length < 3) imgs = [p.cover, p.cover, p.cover];
          imgs = imgs.slice(0, 5);
        } else {
          // 'trio' / default
          imgs = [
            p.heroLeft || (sec0 && sec0.images && sec0.images[0]),
            p.cover,
            p.heroRight || (sec1 && sec1.images && sec1.images[0]) || (sec0 && sec0.images && sec0.images[1])
          ].filter(Boolean);
        }
      }

      // Helper: convert a heroPos entry to an inline style string
      function posStyle(pos) {
        if (!pos) return '';
        return Object.entries(pos)
          .map(([k, v]) => `${k.replace(/([A-Z])/g, '-$1').toLowerCase()}: ${v}`)
          .join('; ');
      }

      let inner = '';
      if (style === 'single') {
        const src = (imgs && imgs[0]) || p.cover;
        const pos = (p.heroPos && p.heroPos[0]) || {};
        const content = (typeof src === 'string' && src.trim().startsWith('<svg'))
          ? src
          : img(src, `${p.title} Graphic`);
        inner = `<div class="hero-single__item" style="${posStyle(pos)}">${content}</div>`;
      } else if (style === 'device') {
        inner = `
          <div class="hero-device">
            <div class="hero-device__speaker"></div>
            <div class="hero-device__screen">${img(imgs[0] || p.cover, p.title)}</div>
          </div>`;
      } else if (style === 'duo') {
        inner = imgs.slice(0, 2).map((src, i) => {
          const pos = (p.heroPos && p.heroPos[i]) || {};
          const content = (typeof src === 'string' && src.trim().startsWith('<svg'))
            ? src
            : img(src, `${p.title} Graphic ${i + 1}`);
          return `<div class="hero-duo__item hero-duo__item--${i + 1}" style="${posStyle(pos)}">${content}</div>`;
        }).join('');
      } else if (style === 'spread') {
        inner = imgs.map((src, i) =>
          `<div class="hero-card hero-card--spread hero-card--spread-${i + 1}">${img(src, p.title)}</div>`
        ).join('');
      } else if (style === 'cinematic') {
        inner = `<div class="hero-card hero-card--cinematic">${img(imgs[0] || p.cover, p.title)}</div>`;
      } else if (style === 'trio-svg' || style === 'trio-free') {
        inner = imgs.slice(0, 3).map((src, i) => {
          const pos = (p.heroPos && p.heroPos[i]) || {};
          const content = (typeof src === 'string' && src.trim().startsWith('<svg'))
            ? src
            : img(src, `${p.title} Graphic ${i + 1}`);
          return `<div class="hero-trio__item hero-trio__item--${i + 1}" style="${posStyle(pos)}">${content}</div>`;
        }).join('');
      } else {
        // 'trio' (classic 3-card stack) / default fallback
        inner = imgs.slice(0, 3).map((src, i) =>
          `<div class="hero-card hero-card--trio hero-card--trio-${i + 1}">${img(src, p.title)}</div>`
        ).join('');
      }

      return `<div class="hero-media hero-media--${style}${extraClass}">${inner}</div>`;
    }

    /* build the detail page for one project */
    function renderDetail(p) {
      const menu = p.sections
        .map((s, i) => `<a href="#${p.id}" data-sec="${i}" class="${i === 0 ? 'active' : ''}">${s.heading}</a>`)
        .join('');

      const heroMedia = renderHeroMedia(p);

      const body = p.sections.map((s, i) => {
        const imgs = (s.images || []).filter(src => typeof src === 'string' && src.trim() !== '');
        const gallery = imgs.length > 0
          ? imgs.map((src, idx) => `<figure>${img(src, s.heading, imgs, idx)}</figure>`).join('')
          : '';
        const bodyContent = (s.body || '')
          .split(/(?:\r?\n|\u2028){2,}/)
          .filter(Boolean)
          .map(para => `<p>${para.replace(/(?:\r?\n|\u2028)/g, '<br>')}</p>`)
          .join('') || `<p></p>`;
        return `
    <section class="detail__section" id="sec-${i}">
      <h2>${s.heading}</h2>
      ${bodyContent}
      ${gallery}
    </section>`;
      }).join('');

      detailView.innerHTML = `
    <article class="detail">
      <div class="detail__band" style="--grad:${p.grad || ''}">
        <div class="band__inner">
          <div class="hero-text">
            ${p.eyebrow ? `<p class="hero-eyebrow">${p.eyebrow}</p>` : ''}
            <h1 class="hero-headline">${p.headline || p.title}</h1>
            ${p.blurb ? `<p class="hero-sub">${p.blurb}</p>` : ''}
          </div>
          ${heroMedia}
        </div>
      </div>
      <div class="detail__grid">
        <aside class="detail__nav">
          <a class="detail__back" href="#">&larr; Back</a>
          <nav class="detail__menu">${menu}</nav>
        </aside>
        <div class="detail__herospace" aria-hidden="true"></div>
        <div class="detail__main">${body}</div>
      </div>
    </article>`;

      setupScrollSpy(p);
      initParallax(p);
      setupLightboxTriggers();
    }

    /* clicking any content-section photo opens it large, with the rest of its
       section's photos as a scrollable thumbnail rail to jump between */
    function setupLightboxTriggers() {
      detailView.querySelectorAll('.detail__section img.lit').forEach(el => {
        el.addEventListener('click', () => {
          let imgs;
          try { imgs = JSON.parse(el.dataset.imgs); } catch (e) { imgs = [el.getAttribute('src')]; }
          openLightbox(imgs, +el.dataset.idx);
        });
      });
    }

    let lbImages = [], lbIndex = 0;
    function ensureLightbox() {
      let lb = document.getElementById('lightbox');
      if (lb) return lb;
      lb = document.createElement('div');
      lb.id = 'lightbox';
      lb.className = 'lightbox';
      lb.innerHTML = `
    <button class="lightbox__close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous">&larr;</button>
    <div class="lightbox__stage"><img class="lightbox__img" alt=""></div>
    <button class="lightbox__nav lightbox__nav--next" aria-label="Next">&rarr;</button>
    <div class="lightbox__rail"></div>`;
      document.body.appendChild(lb);
      lb.querySelector('.lightbox__close').addEventListener('click', closeLightbox);
      lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
      lb.querySelector('.lightbox__nav--prev').addEventListener('click', () => navLightbox(-1));
      lb.querySelector('.lightbox__nav--next').addEventListener('click', () => navLightbox(1));
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
      });
      return lb;
    }
    function renderLightboxRail(lb) {
      lb.querySelector('.lightbox__rail').innerHTML = lbImages.map((src, i) =>
        `<button class="lightbox__thumb${i === lbIndex ? ' is-active' : ''}" data-i="${i}">${img(src, '')}</button>`
      ).join('');
      lb.querySelectorAll('.lightbox__thumb').forEach(btn => {
        btn.addEventListener('click', () => { lbIndex = +btn.dataset.i; updateLightbox(lb); });
      });
    }
    function updateLightbox(lb) {
      lb.querySelector('.lightbox__img').src = lbImages[lbIndex];
      lb.querySelectorAll('.lightbox__thumb').forEach((t, i) => t.classList.toggle('is-active', i === lbIndex));
      const active = lb.querySelector('.lightbox__thumb.is-active');
      if (active && active.scrollIntoView) { try { active.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { } }
      const multi = lbImages.length > 1;
      lb.querySelector('.lightbox__nav--prev').style.display = multi ? '' : 'none';
      lb.querySelector('.lightbox__nav--next').style.display = multi ? '' : 'none';
      lb.querySelector('.lightbox__rail').style.display = multi ? '' : 'none';
    }
    function navLightbox(delta) {
      lbIndex = (lbIndex + delta + lbImages.length) % lbImages.length;
      updateLightbox(ensureLightbox());
    }
    function openLightbox(images, idx) {
      lbImages = images; lbIndex = idx;
      const lb = ensureLightbox();
      renderLightboxRail(lb);
      updateLightbox(lb);
      lb.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      if (lb) lb.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    /* parallax: the images ride straight up (faster than the page) and,
       clipped by the gradient, rise to cover the headline. No scaling.
       Controlled per project via `p.parallax` (boolean or speed number, defaults to true). */
    function initParallax(p) {
      if (onParallaxScroll) {
        window.removeEventListener('scroll', onParallaxScroll);
        onParallaxScroll = null;
      }

      const media = detailView.querySelector('.hero-media');
      if (!media) return;

      // Switch: if parallax is set to false for this project, reset and exit
      if (p && p.parallax === false) {
        media.style.transform = '';
        return;
      }

      if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;

      const speed = (p && typeof p.parallax === 'number') ? p.parallax : 0.3;

      let ticking = false;
      function update() {
        const y = window.scrollY;
        media.style.transform = `translateY(${-y * speed}px)`;  // rise up
        ticking = false;
      }
      onParallaxScroll = () => { if (!ticking) { requestAnimationFrame(update); ticking = true; } };
      window.addEventListener('scroll', onParallaxScroll, { passive: true });
      update();
    }

    /* highlight the left-menu item for the section currently in view & toggle nav dark/light text */
    function setupScrollSpy(p) {
      const nav = detailView.querySelector('.detail__nav');
      const links = [...detailView.querySelectorAll('.detail__menu a')];
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const i = e.target.id.split('-')[1];
            links.forEach(l => l.classList.toggle('active', l.dataset.sec === i));
          }
        });
      }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
      detailView.querySelectorAll('.detail__section').forEach(sec => io.observe(sec));

      // Toggle nav text color: white over hero gradient, black/dark over white content
      const heroSpace = detailView.querySelector('.detail__herospace');
      if (heroSpace && nav) {
        const heroIo = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            nav.classList.toggle('is-scrolled', !e.isIntersecting);
          });
        }, { rootMargin: '-80px 0px 0px 0px', threshold: 0 });
        heroIo.observe(heroSpace);
      }
    }

    function renderPhotography() {
      photographyView.innerHTML = `
        <section class="photog">
          <header class="photog__head">
            <h1>Photography</h1>
            <p>Passion project, here and there!</p>
          </header>
          <div class="photog__grid">
            ${PHOTOS.map((f, i) =>
        `<img class="photog__img" src="images/photography/${f}"
                alt="Photo ${i + 1}" data-idx="${i}">`
      ).join('')}
          </div>
          <p class="photog__signoff">film &amp; light &amp; all the good stuff in between — cheers to more to come 🥂</p>
        </section>`;

      /* Lightbox — lives on body so position:fixed works regardless of
         any stacking context the view container might create */
      let lb = document.getElementById('photog-lb');
      if (!lb) {
        lb = document.createElement('div');
        lb.id = 'photog-lb';
        lb.className = 'photog__lb';
        lb.innerHTML = `<img id="photog-lb-img" src="" alt="">`;
        document.body.appendChild(lb);
        lb.addEventListener('click', () => lb.classList.remove('is-open'));
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') lb.classList.remove('is-open');
        });
      }
      const lbImg = document.getElementById('photog-lb-img');
      let cameraFlashTimer;

      photographyView.addEventListener('click', e => {
        const img = e.target.closest('.photog__img');
        if (!img) return;
        lbImg.src = img.src;
        lb.classList.add('is-open');
        document.body.classList.add('is-camera-flash');
        clearTimeout(cameraFlashTimer);
        cameraFlashTimer = setTimeout(() => document.body.classList.remove('is-camera-flash'), 180);
      });

      /* Scroll reveal — each photo fades in only when it enters the viewport */
      const revealObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          const img = e.target;
          const idx = +img.dataset.idx;
          img.style.transitionDelay = `${(idx % 4) * 60}ms`;
          img.classList.add('is-visible');
          revealObs.unobserve(img);
        });
      }, {
        threshold: 0.01,
        rootMargin: '0px 0px -40px 0px'   /* only trigger once image is 40px inside bottom of viewport */
      });

      photographyView.querySelectorAll('.photog__img').forEach(img => revealObs.observe(img));
    }

    function route() {
      const id = location.hash.replace('#', '');
      if (id === 'work') { renderWork(); showView('work'); return; }
      if (id === 'about') { renderAbout(); showView('about'); return; }
      if (id === 'photography') { renderPhotography(); showView('photography'); return; }
      const proj = PROJECTS.find(p => p.id === id);
      if (proj) { renderDetail(proj); showView('detail'); }
      else { showView('home'); }
    }

    window.addEventListener('hashchange', route);
    route();  // handle initial load / deep link
  </script>
